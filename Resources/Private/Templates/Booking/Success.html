<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>

<f:comment>
    Shown after a booking was made: what happened (confirmed, pending
    confirmation by email, on the waiting list) and the booking facts.

    Variables: booking (Booking), event, occurrence, settings.
</f:comment>
<f:section name="Main">
    <div class="golbbooking golbbooking--success">
        <h2 class="golbbooking__title"><f:translate key="success.title.{booking.status}" extensionName="GolbEventsBooking"/></h2>
        <p class="golbbooking-notice golbbooking-notice--{booking.status}"><f:translate key="success.text.{booking.status}" extensionName="GolbEventsBooking" arguments="{0: booking.email}"/></p>
        <f:render partial="Booking/Summary" arguments="{booking: booking, event: event, occurrence: occurrence, settings: settings}"/>
        <f:if condition="{booking.active}">
            <p class="golbbooking__actions">
                <f:link.action action="cancel" controller="Booking" arguments="{token: booking.token}" class="golbbooking__action golbbooking__action--cancel"><f:translate key="action.cancel" extensionName="GolbEventsBooking"/></f:link.action>
            </p>
        </f:if>
    </div>
</f:section>
</html>

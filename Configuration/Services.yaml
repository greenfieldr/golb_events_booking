services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Greenfieldr\GolbEventsBooking\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Used from the Golb Events DataHandler hook and the commands outside of
  # Extbase requests, and by the functional tests
  Greenfieldr\GolbEventsBooking\Service\BookingStateService:
    public: true

  Greenfieldr\GolbEventsBooking\Service\AvailabilityService:
    public: true

  Greenfieldr\GolbEventsBooking\Service\TokenService:
    public: true

  Greenfieldr\GolbEventsBooking\Configuration\ExtensionSettings:
    public: true

  Greenfieldr\GolbEventsBooking\Domain\Repository\BookingRepository:
    public: true

  Greenfieldr\GolbEventsBooking\Domain\Repository\BookingSettingsRepository:
    public: true
